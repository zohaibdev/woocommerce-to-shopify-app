; Shift Shop queue workers — supervisor (VPS / any host with root).
;
; Prefer this over deploy/queue-workers.sh wherever supervisor is available:
; supervisor restarts a worker the instant it dies rather than up to a minute
; later, and it will not let a crash-looping worker hammer the host.
;
; Install:
;   sudo cp store-shift-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start store-shift-worker:*
;
; After deploying new code:
;   sudo supervisorctl restart store-shift-worker:*
;   (PHP holds the old classes in memory for the life of the process.)

[program:store-shift-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/USER/public_html/app/backend/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=600 --max-time=3600
directory=/home/USER/public_html/app/backend
user=USER
autostart=true
autorestart=true

; How many batches run side by side. ShopifyPlan derives the safe number from the
; shop's REAL Shopify budget (up to config/migration.php's max_concurrency, 8) —
; this is the pool that lets it actually happen. Past a handful of workers the
; merchant's WooCommerce host, not Shopify, becomes the limit.
numprocs=8

; Must stay under the queue's retry_after (900s in config/queue.php). Above it,
; the queue decides a running job is dead and starts a second copy of it — which
; replays the page and doubles every Shopify write on it.
stopwaitsecs=610

; Let a batch finish rather than killing it mid-item on restart.
stopasgroup=true
killasgroup=true

redirect_stderr=true
stdout_logfile=/home/USER/public_html/app/backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
